<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Lynx Samurai — business card front</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* 3.5x2in + .125in bleed = 3.75x2.25in; 300dpi = 1125x675px */
:root{--ink:#0b0b0f;--red:#d4202a;--gold:#f2b632;--steel:#c9ccd4;--paper:#f4efe6}
html,body{margin:0;padding:0;background:#888}
.card{position:relative;width:3.625in;height:2.125in;overflow:hidden;background:var(--ink);font-family:"Inter",sans-serif;color:var(--steel)}
.sun{position:absolute;width:3in;height:3in;border-radius:50%;left:-1.1in;top:-.5in;background:radial-gradient(circle,rgba(212,32,42,.55),rgba(212,32,42,0) 68%)}
.slash{position:absolute;height:.03in;width:4.5in;background:linear-gradient(90deg,transparent,var(--red),transparent);transform:rotate(-28deg);opacity:.7}
.s1{left:-.5in;top:1.7in}.s2{left:.2in;top:2.05in;opacity:.4}
.inner{position:absolute;inset:.0625in;display:flex;align-items:center;gap:.2in;padding:.14in .25in}
.logo{width:1.25in;height:1.25in;border-radius:.16in;background:var(--paper);padding:.05in;border:.03in solid var(--red);box-shadow:0 0 0 .035in var(--gold);transform:rotate(-2deg);flex:none}
.logo img{display:block;width:100%;height:100%;object-fit:contain}
.txt{flex:1;min-width:0}
.name{font-family:"Cinzel",Georgia,serif;font-weight:800;font-size:.24in;line-height:1;color:#fff;letter-spacing:.01in;margin:0}
.name span{color:var(--red)}
.tag{font-family:"Cinzel",serif;font-weight:600;font-size:.085in;letter-spacing:.015in;line-height:1.5;text-transform:uppercase;color:var(--gold);margin:.09in 0 0}
.rule{height:.02in;width:.9in;background:linear-gradient(90deg,var(--red),var(--gold));margin:.1in 0}
.url{margin:0;font-size:.14in;font-weight:800;color:#fff;letter-spacing:.005in}.url span{color:var(--gold)}
.trim{position:absolute;inset:.0625in;border:1px dashed rgba(242,182,50,.45);pointer-events:none;display:none}body.preview .trim{display:block}
</style></head><body><div class="card"><div class="sun"></div><div class="slash s1"></div><div class="slash s2"></div><div class="trim"></div>
<div class="inner"><div class="logo"><img src="../assets/logo.png" alt="Lynx Samurai logo"></div>
<div class="txt"><p class="name">LYNX <span>SAMURAI</span></p><p class="tag">Swords • Knives • Collectibles<br>Jewelry • Shirts</p><div class="rule"></div><p class="url">lynx<span>samurai</span>.com</p></div></div></div></body></html>
