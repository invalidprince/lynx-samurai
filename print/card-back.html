<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Lynx Samurai — business card back</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0b0f;--red:#d4202a;--gold:#f2b632;--steel:#c9ccd4;--paper:#f4efe6;--muted:#9a9cab}
html,body{margin:0;padding:0;background:#888}
.card{position:relative;width:3.75in;height:2.25in;overflow:hidden;background:var(--paper);font-family:"Inter",sans-serif;color:var(--ink)}
.band{position:absolute;left:0;right:0;top:0;height:.16in;background:var(--ink)}
.band::after{content:"";position:absolute;left:0;right:0;bottom:-.025in;height:.025in;background:linear-gradient(90deg,var(--red),var(--gold),var(--red))}
.band-b{top:auto;bottom:0;height:.1in}.band-b::after{bottom:auto;top:-.025in}
.kanji{position:absolute;right:.2in;top:.1in;font-size:1.9in;color:rgba(212,32,42,.07);font-family:serif;line-height:1}
.inner{position:absolute;inset:.28in .3in .26in .3in;display:flex;gap:.2in;align-items:stretch}
.left{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.right{width:1.05in;display:flex;flex-direction:column;align-items:center;justify-content:center}
.h{font-family:"Cinzel",serif;font-weight:800;font-size:.15in;line-height:1.05;margin:0;color:var(--ink)}.h span{color:var(--red)}
.lead{font-size:.085in;line-height:1.3;margin:.04in 0 0;color:#3a3a46;max-width:2.15in}
.visit{margin:.05in 0 0;font-size:.085in;line-height:1.4;color:var(--ink)}
.visit b{font-family:"Cinzel",serif;font-size:.085in;letter-spacing:.02in;text-transform:uppercase;color:var(--red)}
.url{margin:0;font-size:.15in;font-weight:800;color:var(--ink);white-space:nowrap}.url span{color:var(--red)}
.sub{margin:.015in 0 0;font-size:.08in;color:#6a6a78}
.qrbox{background:#fff;border-radius:.1in;padding:.07in;border:.03in solid var(--ink);box-shadow:.04in .04in 0 var(--red)}
.qrbox img{display:block;width:.86in;height:.86in}
.scan{margin:.07in 0 0;font-size:.085in;font-weight:800;color:var(--ink);text-align:center;letter-spacing:.01in;text-transform:uppercase}
.trim{position:absolute;inset:.125in;border:1px dashed rgba(11,11,15,.35);pointer-events:none;display:none}body.preview .trim{display:block}
</style></head><body><div class="card"><div class="band"></div><div class="band band-b"></div><div class="kanji">侍</div><div class="trim"></div>
<div class="inner"><div class="left"><div>
<p class="h">Katanas <span>•</span> Fantasy Blades <span>•</span> Armor</p>
<p class="lead">Hand-picked collectible swords, daggers, and samurai armor. Reserve a piece or ask what's in stock.</p>
<p class="visit"><b>Shop</b> · 135 W King St, Abbottstown, PA 17301<br><b>Hours</b> · Thu – Sat, 12 – 4 pm</p>
</div><div><p class="url">lynx<span>samurai</span>.com</p><p class="sub">Also at shows &amp; markets across central PA</p></div></div>
<div class="right"><div class="qrbox"><img src="../assets/qr-site.svg" alt="QR code to lynxsamurai.com"></div><p class="scan">Scan to visit</p></div></div></div></body></html>
